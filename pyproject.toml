[project]
name = "job-hunt-tools"
version = "0.1.0"
description = "Python tools for the job-hunt pipeline (guards, coverage scoring, DB access)"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0",
    "psycopg[binary]>=3.2",
    "minio>=7.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
