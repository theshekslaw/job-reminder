name: job-hunt

services:
  db:
    image: postgres:16-alpine
    container_name: jobhunt-db
    environment:
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD: jobhunt
      POSTGRES_DB: jobhunt
    ports:
      - "5436:5432"          # non-default host port; 5432-5435 are taken on this machine
    volumes:
      - ./state/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunt -d jobhunt"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: jobhunt-adminer
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:latest
    container_name: jobhunt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-jobhunt}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-local-only}
    ports:
      - "9002:9000"          # S3 API (9000/9001 taken by another project)
      - "9003:9001"          # web console
    volumes:
      - ./state/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the `resumes` bucket, then exit.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: jobhunt-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-jobhunt} $${MINIO_ROOT_PASSWORD:-change-me-local-only} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-resumes} &&
      echo 'bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-jobhunt}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-local-only}
